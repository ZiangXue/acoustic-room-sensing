<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor Tracker</title>
<style>
  :root { --bg:#111418; --panel:#1a1f26; --fg:#e6e9ee; --dim:#8b95a3; --ok:#3ddc84; --bad:#ff5a5f; --line:#2c3440; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f5f8; --panel:#fff; --fg:#14181f; --dim:#5b6573; --ok:#138a4b; --bad:#d6313a; --line:#d5dbe3; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .pill { padding:2px 10px; border-radius:99px; font-size:13px; border:1px solid var(--line); color:var(--dim); }
  .pill.on { color:var(--ok); border-color:var(--ok); }
  .pill.off { color:var(--bad); border-color:var(--bad); }
  main { display:grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap:14px; padding:14px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; }
  img#video { width:100%; display:block; border-radius:6px; background:#000; aspect-ratio:16/9; }
  canvas { width:100%; display:block; border-radius:6px; }
  .readout { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-top:10px; }
  .readout div { background:var(--bg); border-radius:8px; padding:8px 12px; }
  .readout b { display:block; font-size:22px; font-variant-numeric: tabular-nums; }
  .readout span { color:var(--dim); font-size:12px; }
  label { color:var(--dim); font-size:13px; display:inline-flex; gap:6px; align-items:center; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>Floor Tracker</h1>
  <span id="status" class="pill off">connecting</span>
  <span id="meta" class="pill">–</span>
</header>
<main>
  <div class="card">
    <img id="video" alt="camera feed">
    <label><input type="checkbox" id="grid"> show calibrated 2 ft grid</label>
  </div>
  <div class="card">
    <canvas id="map" width="720" height="560"></canvas>
    <div class="readout">
      <div><b id="xin">–</b><span>x (in) · along R1→R2, origin R2</span></div>
      <div><b id="yin">–</b><span>y (in) · along the other rug edge</span></div>
      <div><b id="xm">–</b><span>x (m)</span></div>
      <div><b id="ym">–</b><span>y (m)</span></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const IN = 0.0254, FT = 0.3048, TRAIL_S = 12;
let cal = null, trail = [], cur = null;

function setVideo() { $("video").src = "/video?grid=" + ($("grid").checked ? 1 : 0) + "&t=" + Date.now(); }
$("grid").addEventListener("change", setVideo);
setVideo();

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function bounds() {
  const pts = cal.area_xy.concat(Object.values(cal.landmarks));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), pad = 0.25;
  return { x0: Math.min(...xs) - pad, x1: Math.max(...xs) + pad, y0: Math.min(...ys) - pad, y1: Math.max(...ys) + pad };
}

function draw() {
  const c = $("map"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  if (!cal) { requestAnimationFrame(draw); return; }
  const b = bounds(), s = Math.min(c.width / (b.x1 - b.x0), c.height / (b.y1 - b.y0));
  const X = x => (x - b.x0) * s, Y = y => (y - b.y0) * s;   // x right, y down: same orientation as the camera view
  g.lineWidth = 1; g.strokeStyle = css("--line"); g.fillStyle = css("--dim"); g.font = "12px system-ui";
  for (let x = Math.ceil(b.x0 / FT / 2) * 2; x * FT < b.x1; x += 2) { g.beginPath(); g.moveTo(X(x * FT), 0); g.lineTo(X(x * FT), c.height); g.stroke(); g.fillText(x + " ft", X(x * FT) + 3, 12); }
  for (let y = Math.ceil(b.y0 / FT / 2) * 2; y * FT < b.y1; y += 2) { g.beginPath(); g.moveTo(0, Y(y * FT)); g.lineTo(c.width, Y(y * FT)); g.stroke(); g.fillText(y + " ft", 3, Y(y * FT) - 3); }
  g.beginPath(); cal.area_xy.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.closePath();
  g.strokeStyle = css("--ok"); g.lineWidth = 2; g.stroke();
  for (const [n, p] of Object.entries(cal.landmarks)) {
    g.fillStyle = n[0] === "S" ? "#c264ff" : "#e5b800"; g.beginPath(); g.arc(X(p[0]), Y(p[1]), 4, 0, 7); g.fill();
    g.fillText(n, X(p[0]) + 6, Y(p[1]) - 4);
  }
  const now = Date.now() / 1000;
  trail = trail.filter(p => now - p.t < TRAIL_S);
  g.lineWidth = 3;
  for (let i = 1; i < trail.length; i++) {
    g.strokeStyle = `rgba(61,220,132,${Math.max(0, 1 - (now - trail[i].t) / TRAIL_S)})`;
    g.beginPath(); g.moveTo(X(trail[i - 1].x), Y(trail[i - 1].y)); g.lineTo(X(trail[i].x), Y(trail[i].y)); g.stroke();
  }
  if (cur) {
    g.fillStyle = cur.tracking ? css("--ok") : css("--bad");
    g.beginPath(); g.arc(X(cur.x), Y(cur.y), 9, 0, 7); g.fill();
    g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke();
  }
  requestAnimationFrame(draw);
}

fetch("/calibration.json").then(r => r.json()).then(j => { cal = j; });
draw();

const es = new EventSource("/events");
es.onopen = () => { $("status").textContent = "connected"; };
es.onerror = () => { $("status").textContent = "reconnecting"; $("status").className = "pill off"; };
es.onmessage = ev => {
  const s = JSON.parse(ev.data);
  $("status").textContent = s.tracking ? "tracking" : "no person";
  $("status").className = "pill " + (s.tracking ? "on" : "off");
  $("meta").textContent = (s.fps ?? "–") + " fps · lag " + (s.lag_ms ?? "–") + " ms" + (s.tracking ? " · " + s.n_ankles + " ankle" + (s.n_ankles > 1 ? "s" : "") : "");
  if (s.tracking) {
    cur = s; trail.push({ x: s.x, y: s.y, t: Date.now() / 1000 });
    $("xin").textContent = (s.x / IN).toFixed(1); $("yin").textContent = (s.y / IN).toFixed(1);
    $("xm").textContent = s.x.toFixed(2); $("ym").textContent = s.y.toFixed(2);
  } else if (cur) { cur.tracking = false; }
};
</script>
</body>
</html>
